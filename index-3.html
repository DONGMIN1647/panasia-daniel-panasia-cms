<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <!-- 모바일 반응형 강화 -->
  <style>
    
/* ═══════════════════════════════════════
   모바일 레이아웃 (768px 이하)
═══════════════════════════════════════ */

/* ════════════════════════════════════════
   반응형 레이아웃 — 모바일 / 태블릿 / 가로세로
════════════════════════════════════════ */

/* ── 공통: 전체화면 orientation 지원 ── */
html, body {
  width: 100%;
  height: 100%;
}
.app {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

/* ══════════════════════════════
   PC (769px 이상) — 사이드바 좌측
══════════════════════════════ */
@media (min-width: 769px) {
  .app { flex-direction: row; }
  .sb {
    width: var(--sb);
    height: 100vh;
    height: 100dvh;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    flex-shrink: 0;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .con {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 14px 18px;
  }
  /* 카메라 버튼 위치 */
  #cam-btn { bottom: 28px; right: 28px; }
  #cam-scope-modal { bottom: 96px; right: 28px; left: auto; }
}

/* ══════════════════════════════
   태블릿 가로 (1025~1200px)
══════════════════════════════ */
@media (min-width: 1025px) and (max-width: 1200px) {
  :root { --sb: 155px; }
  .ni { font-size: 12px; padding: 6px 12px; }
  .con { padding: 12px 14px; }
}

/* ══════════════════════════════
   태블릿 (769~1024px)
══════════════════════════════ */
@media (min-width: 769px) and (max-width: 1024px) {
  :root { --sb: 150px; }
  .ni { font-size: 11px; padding: 5px 10px; }
  .ns { font-size: 9px; padding: 8px 10px 2px; }
  .con { padding: 10px 12px; }
  .sg { grid-template-columns: repeat(4,1fr); gap: 8px; }
  table { font-size: 11px; }
  th { font-size: 9px; padding: 5px 6px; }
  td { padding: 6px 6px; }
  .gm-box { width: min(640px, 95%) !important; }
}

/* ══════════════════════════════
   모바일 세로 (max 768px portrait)
══════════════════════════════ */
@media (max-width: 768px) and (orientation: portrait) {
  :root { --sb: 0px; }

  .app {
    flex-direction: column;
  }

  /* 사이드바 → 하단 탭바 */
  .sb {
    order: 3;
    width: 100% !important;
    height: auto !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    border-right: none !important;
    border-top: 1px solid var(--border) !important;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 500;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .sb::-webkit-scrollbar { display: none; }
  .sb-brand { display: none !important; }
  .sb-foot  { display: none !important; }
  .ns       { display: none !important; }
  .desktop-only { display: none !important; }

  .ni {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 10px 4px;
    min-width: 58px;
    font-size: 9px;
    gap: 2px;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .ni.active {
    border-bottom-color: var(--text-info);
    background: var(--bg-info);
    color: var(--text-info);
  }
  .ni-icon { font-size: 18px; width: auto; }

  /* 메인 영역 */
  .main {
    order: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: calc(100dvh - 52px - 60px - env(safe-area-inset-bottom, 0px));
  }

  /* 상단 헤더 */
  .top {
    order: 1;
    height: 52px;
    flex-shrink: 0;
    padding: 0 12px;
  }
  .top-title { font-size: 14px; font-weight: 800; }
  .chip { font-size: 11px; padding: 4px 9px; }

  /* 콘텐츠 — 풀스크린 스크롤 */
  .con {
    order: 2;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 12px;
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    -webkit-overflow-scrolling: touch;
    width: 100%;
  }

  /* 그리드 조정 */
  .sg  { grid-template-columns: 1fr 1fr !important; gap: 7px; }
  .sg3 { grid-template-columns: repeat(3,1fr) !important; }
  .sg5 { grid-template-columns: repeat(3,1fr) !important; }
  .d2  { grid-template-columns: 1fr !important; }
  .vg  { grid-template-columns: 1fr !important; }
  .std-grid { grid-template-columns: 1fr !important; }
  .fr  { grid-template-columns: 1fr !important; }
  .fr3 { grid-template-columns: 1fr 1fr !important; }
  .fr4 { grid-template-columns: 1fr 1fr !important; }

  /* 카드 */
  .card-h { font-size: 12px; padding: 8px 11px; }
  .card-b { padding: 9px 11px; }
  .sc { padding: 9px 10px; }
  .sl { font-size: 11px; }
  .sv { font-size: 18px; }

  /* 테이블 */
  table { font-size: 11px !important; }
  th { font-size: 9px !important; padding: 5px 5px !important; }
  td { padding: 6px 5px !important; }
  .card > div[style*="overflow-x"] { overflow-x: auto; }

  /* 탭 */
  .tr { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tr::-webkit-scrollbar { display: none; }
  .t { font-size: 11px; padding: 6px 10px; }

  /* 버튼 */
  .btn    { font-size: 12px; padding: 6px 12px; }
  .btn-sm { font-size: 10px; padding: 3px 8px; }

  /* 모달 — 하단 시트 */
  .gm-overlay { align-items: flex-end !important; padding: 0 !important; }
  .gm-box {
    width: 100% !important;
    max-height: 88vh !important;
    border-radius: 18px 18px 0 0 !important;
    position: fixed !important;
    bottom: 0; left: 0; right: 0;
  }
  .gm-head { padding: 12px 14px; }
  .gm-body { padding: 12px 14px; }
  .gm-foot { padding: 10px 14px; flex-wrap: wrap; gap: 6px; }
  .gm-gr  { grid-template-columns: 1fr !important; }
  .gm-gr3 { grid-template-columns: 1fr 1fr !important; }

  /* 카메라 버튼 */
  #cam-btn {
    bottom: calc(68px + env(safe-area-inset-bottom, 0px)) !important;
    right: 12px !important;
    width: 48px !important;
    height: 48px !important;
    font-size: 20px !important;
  }
  #cam-scope-modal {
    bottom: calc(126px + env(safe-area-inset-bottom, 0px)) !important;
    right: 12px !important;
    left: 12px !important;
  }

  /* 사진 그리드 */
  .photo-grid { grid-template-columns: repeat(auto-fill, minmax(80px,1fr)) !important; }

  /* 주간보고서 */
  .wk-kgrid { grid-template-columns: repeat(3,1fr) !important; }
  .wk-kv { font-size: 17px; }
}

/* ══════════════════════════════
   모바일 가로 (max 900px landscape)
══════════════════════════════ */
@media (max-width: 900px) and (orientation: landscape) {
  :root { --sb: 52px; }

  .app { flex-direction: row; }

  /* 사이드바 → 좌측 아이콘 전용 좁은 바 */
  .sb {
    width: 52px !important;
    height: 100dvh !important;
    flex-direction: column !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    border-right: 1px solid var(--border) !important;
    border-top: none !important;
    position: relative !important;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    scrollbar-width: none;
    flex-shrink: 0;
  }
  .sb::-webkit-scrollbar { display: none; }

  /* 브랜드 — 아이콘만 */
  .sb-brand {
    display: flex !important;
    flex-direction: column;
    align-items: center;
    padding: 10px 4px 6px;
    border-bottom: 1px solid var(--border);
  }
  .sb-logo { display: none; }
  .sb-name { display: none; }
  .sb-ver  { display: none; }
  .sb-brand-icon { display: flex !important; }
  .sb-foot { display: none !important; }
  .ns      { display: none !important; }
  .desktop-only { display: none !important; }

  /* 탭 아이템 — 아이콘만 세로 배열 */
  .ni {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    min-width: 0;
    width: 100%;
    font-size: 0; /* 텍스트 숨김 */
    gap: 0;
    border-radius: 0;
    border-left: 2px solid transparent;
    border-bottom: none;
  }
  .ni.active {
    background: var(--bg-info);
    border-left-color: var(--text-info);
    color: var(--text-info);
  }
  .ni > span:last-child { display: none; } /* 텍스트 span 숨김 */
  .ni-icon { font-size: 20px; width: 28px; text-align: center; }

  /* 메인 */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* 헤더 */
  .top {
    height: 44px;
    padding: 0 10px;
    flex-shrink: 0;
  }
  .top-title { font-size: 13px; font-weight: 800; }
  .chip { font-size: 10px; padding: 3px 8px; }

  /* 콘텐츠 */
  .con {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 10px;
    -webkit-overflow-scrolling: touch;
    width: 100%;
  }

  /* 그리드 */
  .sg  { grid-template-columns: repeat(4,1fr) !important; gap: 6px; }
  .sg3 { grid-template-columns: repeat(3,1fr) !important; }
  .sg5 { grid-template-columns: repeat(5,1fr) !important; }
  .d2  { grid-template-columns: 1fr 1fr !important; gap: 8px; }
  .fr  { grid-template-columns: 1fr 1fr !important; }
  .fr3 { grid-template-columns: 1fr 1fr 1fr !important; }
  .fr4 { grid-template-columns: 1fr 1fr !important; }

  /* 카드 */
  .card-h { font-size: 11px; padding: 7px 10px; }
  .card-b { padding: 8px 10px; }
  .sc { padding: 8px 10px; }
  .sl { font-size: 10px; }
  .sv { font-size: 16px; }

  /* 테이블 */
  table { font-size: 10px !important; }
  th { font-size: 8px !important; padding: 4px 5px !important; }
  td { padding: 5px 5px !important; }

  /* 버튼 */
  .btn    { font-size: 11px; padding: 5px 10px; }
  .btn-sm { font-size: 9px;  padding: 2px 6px; }

  /* 모달 */
  .gm-box { width: min(600px,90%) !important; max-height: 90vh !important; border-radius: 14px !important; }
  .gm-overlay { align-items: center !important; }

  /* 카메라 */
  #cam-btn {
    bottom: 12px !important;
    right: 12px !important;
    width: 44px !important;
    height: 44px !important;
    font-size: 18px !important;
  }
  #cam-scope-modal {
    bottom: 66px !important;
    right: 12px !important;
    left: auto !important;
  }

  /* 주간 */
  .wk-kgrid { grid-template-columns: repeat(5,1fr) !important; }
}

/* ── 소형 폰 세로 (480px 이하) ── */
@media (max-width: 480px) and (orientation: portrait) {
  .sg  { grid-template-columns: 1fr 1fr !important; }
  .sg3 { grid-template-columns: 1fr 1fr !important; }
  .sg5 { grid-template-columns: repeat(2,1fr) !important; }
  .fr3 { grid-template-columns: 1fr !important; }
  .fr4 { grid-template-columns: 1fr 1fr !important; }
  .ni  { min-width: 50px; font-size: 8px; padding: 5px 8px 4px; }
  .ni-icon { font-size: 16px; }
  .top-title { font-size: 13px; }
  .wk-kgrid { grid-template-columns: repeat(2,1fr) !important; }
}

/* ── 모바일 only/desktop only ── */
.mobile-only { display: none; }
.desktop-only { display: block; }
@media (max-width: 768px) {
  .mobile-only { display: flex !important; }
}
@media (max-width: 900px) and (orientation: landscape) {
  .desktop-only { display: none !important; }
}


  
.mobile-only { display: none; }
@media (max-width: 768px) {
  .mobile-only { display: flex !important; }
}

.desktop-only { display: block; }
@media (max-width: 768px) {
  .desktop-only { display: none !important; }
}


/* ════════════════════════════
   로그인 화면
════════════════════════════ */
.login-overlay{position:fixed;inset:0;z-index:9900;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f172a 0%,#1e3a8a 60%,#1d4ed8 100%)}
.login-box{background:#fff;border-radius:20px;padding:36px 32px;width:min(380px,92vw);box-shadow:0 24px 64px rgba(0,0,0,.35)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo-icon{width:72px;height:72px;background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;box-shadow:0 8px 24px rgba(37,99,235,.35)}
.login-logo h1{font-size:18px;font-weight:900;color:#0f172a}
.login-logo p{font-size:12px;color:#64748b;margin-top:3px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.login-field input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;transition:border .15s;outline:none}
.login-field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;font-family:inherit;transition:opacity .15s;box-shadow:0 4px 16px rgba(37,99,235,.35)}
.login-btn:hover{opacity:.9}
.login-err{background:#fee2e2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;color:#dc2626;margin-bottom:12px;display:none;font-weight:600}
.login-err.show{display:block}
.login-roles{display:flex;gap:8px;margin-bottom:16px}
.login-role-btn{flex:1;padding:10px 8px;border:2px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;color:#334155}
.login-role-btn.active{border-color:#2563eb;background:#eff6ff;color:#2563eb}

/* ════════════════════════════
   관리자 패널 CSS
════════════════════════════ */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.admin-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:all .15s}
.admin-card:hover{border-color:var(--text-info);box-shadow:0 4px 16px rgba(29,78,216,.12)}
.admin-card-icon{font-size:28px;margin-bottom:8px}
.admin-card-title{font-size:13px;font-weight:700;margin-bottom:3px}
.admin-card-desc{font-size:11px;color:var(--text2)}
.admin-card-count{font-size:20px;font-weight:800;color:var(--text-info);margin-top:6px}
.admin-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:12px}
.admin-section-head{padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.admin-section-body{padding:12px 16px}
.user-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.user-row:last-child{border-bottom:none}
.user-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
.user-info{flex:1}
.user-name{font-size:13px;font-weight:700}
.user-role{font-size:11px;color:var(--text2);margin-top:1px}
.role-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.role-admin{background:#fee2e2;color:#dc2626}
.role-manager{background:#dbeafe;color:#1d4ed8}
.role-viewer{background:#f1f5f9;color:#475569}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-val{font-weight:700;color:var(--text-info)}
.log-item{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
.log-item:last-child{border-bottom:none}
.log-item b{color:var(--text);font-weight:600}

<title>PANASIA 시운전 관리시스템</title>
<script>window.Chart=null;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" async onerror="console.warn('Chart.js CDN load failed - charts disabled')"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f6;--bg3:#efefee;
  --bg-info:#eff6ff;--bg-danger:#fff1f2;--bg-warn:#fffbeb;--bg-success:#f0fdf4;
  --text:#1a1a18;--text2:#555550;--text3:#9a9a94;
  --text-info:#1d4ed8;--text-danger:#dc2626;--text-warn:#c96a00;--text-success:#16a34a;
  --border:#e2e2e0;--border2:#c8c8c4;--border-info:#bfdbfe;--border-danger:#fecaca;
  --radius:7px;--radius-lg:11px;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:'JetBrains Mono','Consolas',monospace;
  --sb:190px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;
  --bg-info:#1a3560;--bg-danger:#3f1515;--bg-warn:#3d2c08;--bg-success:#0d2d14;
  --text:#e8e8e4;--text2:#9a9a94;--text3:#5e5e58;
  --text-info:#93c5fd;--text-danger:#f87171;--text-warn:#fbbf24;--text-success:#4ade80;
  --border:#2e2e2c;--border2:#3e3e3a;--border-info:#1a3560;--border-danger:#3f1515;
}}

/* ── 기본 ── */
body{font-family:var(--font);background:var(--bg3);color:var(--text);font-size:14px;line-height:1.5}
.app{display:flex;height:100vh;overflow:hidden}

/* ── 사이드바 ── */
.sb{width:var(--sb);background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-brand{padding:10px 12px 8px;border-bottom:1px solid var(--border)}
.sb-logo{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.12em;text-transform:uppercase}
.sb-name{font-size:14px;font-weight:700;margin-top:3px;color:var(--text)}
.sb-ver{font-size:10px;color:var(--text3);margin-top:2px}
.sb-nav{padding:6px 0;flex:1}
.ns{padding:8px 12px 3px;font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;transition:background .1s;white-space:nowrap}
.ni:hover{background:var(--bg2);color:var(--text)}
.ni.active{background:var(--bg-info);color:var(--text-info);font-weight:700}
.ni-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.sb-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
.sb-foot .vfilt{color:var(--text-info);font-weight:600;font-size:11px;cursor:pointer}

/* ── 메인 영역 ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top{height:44px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
.top-title{font-size:15px;font-weight:700;flex:1}
.chip{font-size:12px;color:var(--text2);background:var(--bg2);padding:5px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--bg-info);color:var(--text-info);border-color:var(--border-info)}
.con{flex:1;overflow-y:auto;padding:12px 16px;box-sizing:border-box}

/* ── 통계 카드 ── */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.sg5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.sc{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--border)}
.sl{font-size:12px;color:var(--text2);margin-bottom:4px}
.sv{font-size:24px;font-weight:700}
.ss{font-size:11px;color:var(--text3);margin-top:3px}
.cd{color:var(--text-danger)}.cw{color:var(--text-warn)}.cs{color:var(--text-success)}.ci{color:var(--text-info)}

/* ── 카드 ── */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:9px}
.card.hi{border-color:var(--border-info)}
.card-h{padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-b{padding:10px 14px}

/* ── 테이블 ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:700;color:var(--text2);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;background:var(--bg2)}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}

/* ── 배지 ── */
.b{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bo{background:var(--bg-danger);color:var(--text-danger)}
.bp{background:var(--bg-warn);color:var(--text-warn)}
.bc{background:var(--bg-success);color:var(--text-success)}
.bi{background:var(--bg-info);color:var(--text-info)}
.bs{background:var(--bg2);color:var(--text2);border:1px solid var(--border);font-size:11px;padding:2px 8px;border-radius:5px}

/* ── 폼 ── */
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.f1{margin-bottom:10px}
label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font-size:13px;padding:8px 11px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:var(--font);transition:border .1s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--text-info)}
textarea{resize:vertical;min-height:64px}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}

/* ── 버튼 ── */

// ── localStorage 저장/불러오기 ──
function save(data){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    showToast('저장 완료 ✓');
  }catch(e){showToast('저장 실패: '+e.message);}
}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null;}
}
function resetData(){
  if(!confirm('모든 데이터를 초기값으로 초기화하시겠습니까?'))return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}
function exportJSON(){
  const data=JSON.stringify(S,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`panasia_cms_${today}.json`;a.click();
  showToast('JSON 내보내기 완료');
}
function importJSON(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        ['vessels','reports','issues','md','mat'].forEach(k=>{if(d[k])S[k]=d[k];});
        save(S);render();showToast('JSON 불러오기 완료');
      }catch(err){alert('파일 형식이 올바르지 않습니다.');}
    };reader.readAsText(file);
  };input.click();
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function renderMDStd(){
  const MD_STD_ACT=getActiveMDStd();
  const all=fv(S.md);
  const sysAct={};SYS.forEach(s=>{const sm=all.filter(m=>m.system===s);sysAct[s]={pl:sm.reduce((a,m)=>a+Number(m.planned),0),ac:sm.reduce((a,m)=>a+Number(m.actual),0),n:sm.length};});
  const colors=['#185FA5','#1D9E75','#534AB7','#D85A30','#BA7517'];
  return`
<div class="sh"><span class="str">시스템별 표준 M/D 기준</span><span style="font-size:11px;color:var(--text3)">기준일 ${today}</span></div>
<div class="card">
  <div class="card-h">표준 M/D vs 실적 비교</div>
  <div class="card-b">
    <table><thead><tr><th>System</th><th style="text-align:center">Pre-Comm</th><th style="text-align:center">Commissioning</th><th style="text-align:center">Perf.Test</th><th style="text-align:center">Punch</th><th style="text-align:center">표준합계</th><th style="text-align:center">계획</th><th style="text-align:center">실적</th><th style="text-align:center">Overrun</th><th>판정</th></tr></thead>
    <tbody>${SYS.map((s,si)=>{const std=MD_STD_ACT[s];const sa=sysAct[s]||{pl:0,ac:0,n:0};const ov=sa.ac-sa.pl;return`<tr>
      <td style="font-weight:700;color:${colors[si]};cursor:pointer" onclick="openMDStdEdit('${s}')" title="클릭하여 편집">${s} ✏</td>
      ${std.phases.map(p=>`<td style="text-align:center">${p.md}</td>`).join('')}
      <td style="text-align:center;font-weight:700;background:var(--bg2)">${std.total}</td>
      <td style="text-align:center">${sa.n>0?sa.pl:'—'}</td>
      <td style="text-align:center;font-weight:600">${sa.n>0?sa.ac:'—'}</td>
      <td style="text-align:center;font-weight:700;color:${ov>0?'var(--text-danger)':ov<0?'var(--text-success)':'var(--text3)'}">${sa.n>0?(ov>0?'+':ov===0?'±':'')+(ov):'—'}</td>
      <td>${sa.n>0?(ov<=0?`<span class="b bc">기준 이내</span>`:`<span class="b bo">Overrun</span>`):`<span class="b bs">데이터 없음</span>`}</td>
    </tr>`;}).join('')}</tbody></table>
  </div>
</div>
<div class="std-grid">${SYS.map((s,si)=>{const std=MD_STD_ACT[s];return`
  <div class="card">
    <div class="card-h" onclick="openMDStdEdit('${s}')" style="cursor:pointer"><span style="color:${colors[si]};font-weight:700">${s}</span> <span style="font-size:10px;font-weight:400;color:var(--text2)">표준 ${std.total} M/D</span><button class="btn btn-sm" onclick="event.stopPropagation();openMDStdEdit('${s}')" style="margin-left:8px">✏ 편집</button></div>
    <div class="card-b">
      ${std.phases.map(p=>`<div class="phase-row"><div class="phase-name">${p.name}</div><div class="phase-md">${p.md}</div><div class="phase-items">${p.items}</div></div>`).join('')}
      <div style="margin-top:9px;padding-top:8px;border-top:1px solid var(--border)">
        <div style="font-size:9px;font-weight:700;color:var(--text-danger);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em">주요 Overrun 원인</div>
        ${std.overruns.map(o=>`<div class="ovr-cause">• ${o}</div>`).join('')}
      </div>
    </div>
  </div>`;}).join('')}</div>`;}

function getWK(){
  const team=S.wkTeam||'시운전지원팀';
  if(team==='시운전실(통합)'){return getMergedWK()||S.weekly_work[0];}
  const arr=loadWKByTeam(team)||S.weekly_work;
  return arr[S.wkId||0]||arr[0];
}
function saveCurrentWK(){
  const team=S.wkTeam||'시운전지원팀';
  if(team==='시운전실(통합)')return;
  const arr=loadWKByTeam(team)||S.weekly_work;
  saveWKByTeam(team,arr);
  if(team==='시운전지원팀')sv();
}

${wkAttach}`;
}

function trCollectAndSave(existing, showMsg=true){
  const g=(id)=>{const el=document.getElementById(id);return el?el.value:'';}
  const nos=[...document.querySelectorAll('.pc-no')].map(e=>e.value);
  const dates=[...document.querySelectorAll('.pc-date')].map(e=>e.value);
  const causes=[...document.querySelectorAll('.pc-cause')].map(e=>e.value);
  const sols=[...document.querySelectorAll('.pc-sol')].map(e=>e.value);
  const pc=nos.map((n,i)=>({no:n,date:dates[i]||'',cause:causes[i]||'',solution:sols[i]||''}));

  const data={
    id:existing?existing.id:'TR'+Date.now(),
    created:g('tr-created')||existing?.created||today,
    trip_start:g('tr-ts')||existing?.trip_start||'',
    trip_end:g('tr-te')||existing?.trip_end||'',
    shipyard:g('tr-sy')||existing?.shipyard||'',
    hull:g('tr-hull')||existing?.hull||'',
    location:g('tr-loc')||existing?.location||'',
    item:g('tr-item')||existing?.item||'',
    system:g('tr-sys')||existing?.system||'',
    type:g('tr-type')||existing?.type||'',
    persons:g('tr-persons')||existing?.persons||'',
    contact_manager:g('tr-contact')||existing?.contact_manager||'',
    classification:g('tr-class')||existing?.classification||'',
    vessel_type:g('tr-vtype')||existing?.vessel_type||'',
    vessel_name:g('tr-vname')||existing?.vessel_name||'',
    owner:g('tr-owner')||existing?.owner||'',
    comm_done:g('tr-cdone')||existing?.comm_done||'',
    design_manager:g('tr-dm')||existing?.design_manager||'',
    prog_manager:g('tr-pm')||existing?.prog_manager||'',
    prog_changes:pc.length?pc:(existing?.prog_changes||[]),
    work_log:g('tr-worklog')||existing?.work_log||'',
    sys_config:g('tr-sysconfig')||existing?.sys_config||'',
    extra_work:g('tr-extra')||existing?.extra_work||'',
    remark:g('tr-remark')||existing?.remark||'',
    status:g('tr-status')||existing?.status||'작성중',
  };

  const rpts=getTripReports();
  if(existing){
    const idx=rpts.findIndex(r=>r.id===existing.id);
    if(idx>=0)rpts[idx]=data;else rpts.unshift(data);
  }else{
    rpts.unshift(data);
    TR_STATE.editId=data.id;
  }
  saveTripReports(rpts);
  return data;
}

function saveTripForm(eid){
  const rpts=getTripReports();
  const existing=eid?rpts.find(r=>r.id===eid):null;
  trCollectAndSave(existing, true);
  TR_STATE.mode='view';
  render();
}

function delTripRpt(id){
  if(!confirm('삭제?'))return;
  const rpts=getTripReports().filter(r=>r.id!==id);
  saveTripReports(rpts);render();
}

const ATTACH_KEY='panasia_attachments';

// 이미지 리사이즈 (최대 800px, JPEG 0.7)
function resizeImage(file, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=800, scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.72));
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function renderAttachSection(scope){
  const data=loadAttach();

  </div>

    <div class="photo-card">

  ${files.length?`<div style="margin-top:${photos.length?'8px':'0'}">${files.map(f=>`

      <span style="font-size:9px;color:var(--text3);white-space:nowrap">${f.date}</span>
      <button class="btn btn-sm btn-d" onclick="delAttach('${scope}','${f.id}')">삭제</button>
    </div>`).join('')}</div>`:''}
  ${!items.length?`<div style="font-size:11px;color:var(--text3);text-align:center;padding:8px">첨부된 파일이 없습니다</div>`:''}
</div>`;
}

function addPhotos(scope,input){
  const files=[...input.files];
  if(!files.length)return;
  let done=0;
  files.forEach(file=>{
    resizeImage(file,b64=>{
      const data=loadAttach();
      if(!data[scope])data[scope]=[];
      data[scope].push({id:'a'+Date.now()+Math.random(),type:'photo',name:file.name,data:b64,date:today});
      saveAttach(data);
      done++;
      if(done===files.length){showToast(`사진 ${files.length}장 추가됨`);render();}
    });
  });
  input.value='';
}

function addFileRefs(scope,input){
  const files=[...input.files];
  if(!files.length)return;
  const data=loadAttach();
  if(!data[scope])data[scope]=[];
  files.forEach(f=>{
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    data[scope].push({id:'a'+Date.now()+Math.random(),type:'file',name:f.name,ext,size:f.size,date:today});
  });
  saveAttach(data);
  showToast(`파일 ${files.length}건 참조 추가됨 (파일명 저장, 실제 파일은 PC에 보관)`);
  input.value='';
  render();
}

function delAttach(scope,id){
  const data=loadAttach();
  if(data[scope])data[scope]=data[scope].filter(a=>a.id!==id);
  saveAttach(data);render();
}

function clearAttach(scope){
  if(!confirm('이 탭의 첨부파일을 전부 삭제할까요?'))return;
  const data=loadAttach();
  delete data[scope];saveAttach(data);render();
}

function viewPhoto(src){
  const ov=document.createElement('div');
  ov.className='modal-overlay';
  ov.innerHTML=`<img class="modal-img" src="${src}">`;
  ov.onclick=()=>document.body.removeChild(ov);
  document.body.appendChild(ov);
}

    <tr><td style="background:var(--bg2);font-weight:700;padding:5px 8px;border:1px solid var(--border)">Date</td><td colspan="3" style="padding:5px 8px;border:1px solid var(--border)">${r.date_start} ~ ${r.date_end}</td></tr>

/* SR 업데이트 헬퍼 */
function srUpdate(el){
  const name=el.name;
  const val=el.value;
  // 라디오 버튼 → 해당 섹션/인덱스 업데이트
  const [sec,idx]=name.split('_');
  const i=parseInt(idx);
  const secMap={sp:'sensors_press',st:'sensors_temp',sph:'sensors_ph',eu:'egc_unit',pu:'pump',va:'valve',do:'dosing',pa:'panel',hx:'hx',ct:'cir_tank'};
  const key=secMap[sec];
  if(key&&srTmp){if(!srTmp[key][i])srTmp[key][i]={};srTmp[key][i].result=val;}
  // Class inspection
  if(name==='cl_alarm'&&srTmp)srTmp.class_alarm=val;
  if(name==='cl_trip'&&srTmp)srTmp.class_trip=val;
}
function srSensor(type,i,field,val){if(!srTmp)return;const k='sensors_'+type;if(!srTmp[k][i])srTmp[k][i]={};srTmp[k][i][field]=val;}
function srEquip(key,i,field,val){if(!srTmp)return;if(!srTmp[key][i])srTmp[key][i]={};srTmp[key][i][field]=val;}
function srHmi(i,val){if(srTmp)srTmp.hmi[i]=val;}
function srOp(mode,i,val){if(srTmp){if(mode==='diesel')srTmp.op_diesel[i]=val;else srTmp.op_gas[i]=val;}}
function srOutstanding(i,val){if(srTmp){if(!srTmp.outstanding)srTmp.outstanding=['','','',''];srTmp.outstanding[i]=val;}}
function srSpare(key,i,field,val){if(srTmp){if(!srTmp[key][i])srTmp[key][i]={};srTmp[key][i][field]=val;}}
function srToggleProcess(p,checked){if(!srTmp)return;if(!srTmp.process)srTmp.process=[];if(checked){if(!srTmp.process.includes(p))srTmp.process.push(p);}else{srTmp.process=srTmp.process.filter(x=>x!==p);}}
function srToggle(key,val,checked){if(!srTmp)return;if(!srTmp[key])srTmp[key]=[];if(checked){if(!srTmp[key].includes(val))srTmp[key].push(val);}else{srTmp[key]=srTmp[key].filter(x=>x!==val);}}
function srTs(i,field,val){if(!srTmp||!srTmp.timesheet)return;srTmp.timesheet[i][field]=val;}
function srAddTs(){if(!srTmp)return;if(!srTmp.timesheet)srTmp.timesheet=[];srTmp.timesheet.push({date:'',se:'',from:'',to:'',cat:'Working',remark:''});render();}
function srDelTs(i){if(!srTmp||!srTmp.timesheet)return;srTmp.timesheet.splice(i,1);render();}

function saveSRForm(){
  if(!srTmp){alert('데이터 없음');return;}
  // 폼에서 직접 값 수집
  const g=(id)=>{const el=document.getElementById(id);return el?el.value:'';}
  srTmp.created=g('sr-created')||srTmp.created;
  srTmp.system=g('sr-system')||srTmp.system;
  srTmp.shipyard=g('sr-sy')||srTmp.shipyard;
  srTmp.hull=g('sr-hull')||srTmp.hull;
  srTmp.vessel_name=g('sr-vessel')||srTmp.vessel_name;
  srTmp.place=g('sr-place')||srTmp.place;
  srTmp.date_start=g('sr-ds')||srTmp.date_start;
  srTmp.date_end=g('sr-de')||srTmp.date_end;
  srTmp.equip_type=g('sr-etype')||srTmp.equip_type;
  srTmp.status=g('sr-status')||srTmp.status;

  const rpts=loadSR();
  const idx=rpts.findIndex(r=>r.id===srTmp.id);
  if(idx>=0)rpts[idx]=JSON.parse(JSON.stringify(srTmp));
  else{rpts.unshift(JSON.parse(JSON.stringify(srTmp)));SR_STATE.editId=srTmp.id;}
  saveSR(rpts);
  SR_STATE.mode='view';
  render();
}
function delSR(id){
  if(!confirm('삭제?'))return;
  const rpts=loadSR().filter(r=>r.id!==id);
  saveSR(rpts);render();
}

/* ── 이메일 자동 전송 (mailto) ── */
function sendEmail(type,id){
  let subject='',body='';
  if(type==='report'){
    const r=S.reports.find(x=>x.id===id);
    if(!r)return;
    subject=`[PANASIA 시운전] Daily Report — ${r.vessel} ${r.system} (${r.date})`;
    body=`안녕하세요,\n\n시운전 현황 보고드립니다.\n\n▣ 선박: ${r.vessel}\n▣ 시스템: ${r.system}\n▣ 일자: ${r.date}\n▣ 담당: ${r.engineer}\n\n[수행 작업]\n${r.work}\n\n[이슈/문제]\n${r.issue||'없음'}\n\n[조치 사항]\n${r.action||'없음'}\n\n[다음 계획]\n${r.next||'없음'}\n\n감사합니다.\nPANASIA 시운전지원팀`;
  } else if(type==='issue'){
    const r=S.issues.find(x=>x.id===id);
    if(!r)return;
    subject=`[PANASIA] ${r.type} — ${r.id} (${r.priority}) ${r.vessel} ${r.system}`;
    body=`안녕하세요,\n\n이슈 현황 공유드립니다.\n\n▣ ID: ${r.id} (${r.type})\n▣ 선박: ${r.vessel} · 시스템: ${r.system}\n▣ 우선순위: ${r.priority}\n▣ 담당: ${r.owner}\n▣ Due: ${r.due||'미정'}\n▣ 상태: ${r.status}\n\n[이슈 내용]\n${r.desc}\n\n[조치 현황]\n${r.action||'검토 중'}\n\n감사합니다.\nPANASIA 시운전지원팀`;
  } else if(type==='mat'){
    const r=S.mat.find(x=>x.id===id);
    if(!r)return;
    subject=`[PANASIA] 자재 요청 — ${r.id} ${r.item} (${r.vessel})`;
    body=`안녕하세요,\n\n자재 요청 내용 공유드립니다.\n\n▣ 요청 번호: ${r.id}\n▣ 선박: ${r.vessel} · 시스템: ${r.system}\n▣ 자재명: ${r.item}\n▣ 수량: ${r.qty} ${r.unit}\n▣ 필요일: ${r.required||'미정'}\n▣ 상태: ${r.status}\n▣ 비고: ${r.remark||'없음'}\n\n감사합니다.\nPANASIA 시운전지원팀`;
  }
  const mailto=`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.open(mailto,'_blank');
}

const COST_KEY='panasia_costdata';

function saveCostData(arr){localStorage.setItem(COST_KEY,JSON.stringify(arr));showToast('용역비 데이터 저장 완료 ✓');}

function openCostEdit(mi){

    ${Object.entries(m.vendors||{}).map(([vnd,amt])=>`<div class="gm-field"><label>${vnd}</label><input type="number" id="cv-${vnd.replace(/[^a-zA-Z0-9가-힣]/g,'_')}" value="${amt}" step="100000"></div>`).join('')}
  `;
  document.getElementById('gm-foot').innerHTML=`
    <button class="btn" onclick="closeModal()">취소</button>
    <button class="btn btn-p" onclick="saveCostEdit(${mi})">💾 저장</button>
  `;
  document.getElementById('gmodal').style.display='flex';
}

function saveCostEdit(mi){
  const data=getCostData();
  const m=data[mi];
  const itemKeys=['SCRUBBER','OCCS','BWTS','iCER','SCR','TLGS','LGIM','기타'];
  m.label=document.getElementById('ce-label')?.value||m.label;
  itemKeys.forEach(k=>{
    const el=document.getElementById(`ce-${k}`);
    if(el)m.items[k]=Number(el.value)||0;
  });
  m.total=itemKeys.reduce((a,k)=>a+(m.items[k]||0),0);
  // 업체별
  Object.keys(m.vendors||{}).forEach(vnd=>{
    const key='cv-'+vnd.replace(/[^a-zA-Z0-9가-힣]/g,'_');
    const el=document.getElementById(key);
    if(el)m.vendors[vnd]=Number(el.value)||0;
  });
  saveCostData(data);
  closeModal();
  render();
}

function saveMDStdEdit(sys){
  const stored=getMDStd();
  const base=stored||(JSON.parse(JSON.stringify(MD_STD)));
  if(!base[sys])return;
  base[sys].phases=base[sys].phases.map((p,pi)=>({
    name:document.getElementById(`mds-name-${pi}`)?.value||p.name,
    md:Number(document.getElementById(`mds-md-${pi}`)?.value)||p.md,
    items:document.getElementById(`mds-items-${pi}`)?.value||p.items,
  }));

function wkTeamKey(team){ return team==='시운전지원팀'?'panasia_wk_support':'panasia_wk_tech'; }

function loadWKByTeam(team){
  if(team==='시운전실(통합)') return null; // 통합은 별도 처리
  try{
    const key=wkTeamKey(team);
    const raw=localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // 기술팀 초기 데이터
  if(team==='시운전기술팀'){
    return [{
      id:'WK_T001',week:'2026-04-W4',date:'2026-04-24',team:'시운전기술팀',

        {system:'SCR',plan:0,progress:0,done:0},
        {system:'TLGS',plan:0,progress:0,done:0}
      ],
      projects:[],feedback:[],tech_feedback:[],trips:[],others:[]
    }];
  }
  return S.weekly_work;
}

function saveWKByTeam(team,arr){
  if(team==='시운전실(통합)')return;

// 자동 집계: 진행/완료를 projects 배열에서 계산
function calcYearProgress(wk){
  if(!wk||!wk.projects)return wk;
  const plan=wk.year_plan||[];
  plan.forEach(y=>{
    const sys=y.system.replace('(SHOP)','').replace('(ONBOARD)','');
    const sysProjects=wk.projects.filter(p=>p.system===sys||p.system===y.system);
    y.progress=sysProjects.filter(p=>p.status==='진행').length;
    y.done=sysProjects.filter(p=>p.status==='완료').length;
  });
  return wk;
}

// 통합 뷰: 지원팀 + 기술팀 합산
function getMergedWK(){
  const sup=loadWKByTeam('시운전지원팀');
  const tec=loadWKByTeam('시운전기술팀');
  const sWk=sup&&sup.length?sup[S.wkId||0]:null;
  const tWk=tec&&tec.length?tec[0]:null;
  if(!sWk&&!tWk)return null;
  const base=sWk||{year_plan:[],projects:[],feedback:[],trips:[],others:[]};
  const merged={
    id:'MERGED',week:base.week,date:base.date,team:'시운전실(통합)',
    year_plan:(base.year_plan||[]).map((y,i)=>{
      const ty=(tWk&&tWk.year_plan&&tWk.year_plan[i])||{plan:0,progress:0,done:0};
      return{system:y.system,plan:y.plan+ty.plan,progress:y.progress+ty.progress,done:y.done+ty.done};
    }),
    projects:[...(sWk?.projects||[]),...(tWk?.projects||[])],
    feedback:[...(sWk?.feedback||[]),...(tWk?.feedback||[])],
    tech_feedback:[...(sWk?.tech_feedback||[]),...(tWk?.tech_feedback||[])],
    trips:[...(sWk?.trips||[]),...(tWk?.trips||[])],
    others:[...(sWk?.others||[]),...(tWk?.others||[])]
  };
  return merged;
}

];

function getUsers(){
  try{
    const raw=localStorage.getItem(USERS_KEY);
    if(raw) return JSON.parse(raw);
    localStorage.setItem(USERS_KEY,JSON.stringify(DEFAULT_USERS));
    return DEFAULT_USERS;
  }catch(e){return DEFAULT_USERS;}
}
function saveUsers(arr){localStorage.setItem(USERS_KEY,JSON.stringify(arr));}

// 현재 세션
let AUTH = {isLoggedIn:false, id:null, name:'', role:'viewer', team:'', color:'#64748b'};

function loadAuth(){
  try{
    const raw=sessionStorage.getItem(AUTH_KEY);
    if(raw){AUTH=JSON.parse(raw);return true;}
  }catch(e){}
  return false;
}
function saveAuth(){sessionStorage.setItem(AUTH_KEY,JSON.stringify(AUTH));}
function clearAuth(){sessionStorage.removeItem(AUTH_KEY);AUTH={isLoggedIn:false,id:null,name:'',role:'viewer',team:'',color:'#64748b'};}

// 로그 기록
function addLog(action, detail=''){
  try{
    const logs=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');
    logs.unshift({time:new Date().toLocaleString('ko-KR'),user:AUTH.name||'미인증',action,detail});
    if(logs.length>200)logs.splice(200);
    localStorage.setItem(LOG_KEY,JSON.stringify(logs));
  }catch(e){}
}
function getLogs(){
  try{return JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch(e){return[];}
}

/* ── 로그인 처리 ── */
function doLogin(){
  const email = document.getElementById('login-email')?.value?.trim()?.toLowerCase();
  const pass  = document.getElementById('login-pass')?.value;
  const errEl = document.getElementById('login-err');
  if(!email||!pass){showLoginErr('이메일과 비밀번호를 입력하세요');return;}
  const users = getUsers();
  const user  = users.find(u=>u.email.toLowerCase()===email && u.password===pass && u.active);
  if(!user){showLoginErr('이메일 또는 비밀번호가 올바르지 않습니다');return;}
  AUTH={isLoggedIn:true,id:user.id,name:user.name,role:user.role,team:user.team,color:user.color};
  saveAuth();
  addLog('로그인','성공');
  document.getElementById('login-screen')?.remove();
  document.body.style.overflow='';
  render();
  showToast(`👋 ${user.name}님, 환영합니다!`);
}

function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?'))return;
  addLog('로그아웃');
  clearAuth();
  showLoginScreen();
}

function showLoginErr(msg){
  const el=document.getElementById('login-err');
  if(el){el.textContent=msg;el.classList.add('show');}
}

function adminAddUser(){
  const name=prompt('이름:','');if(!name)return;
  const email=prompt('이메일:','@panasia.com');if(!email)return;
  const pass=prompt('비밀번호:','panasia123');if(!pass)return;
  const role=prompt('권한 (admin/manager/viewer):','manager');
  const team=prompt('팀 (시운전지원팀/시운전기술팀):','시운전지원팀');
  const colors=['#2563eb','#16a34a','#ea580c','#7c3aed','#0891b2','#db2777'];
  const users=getUsers();
  users.push({id:'u'+Date.now(),name,email,password:pass,role:role||'viewer',color:colors[users.length%colors.length],team:team||'전체',active:true});
  saveUsers(users);
  addLog('계정 추가',name);
  render();showToast('계정이 추가됐습니다 ✓');
}

function adminEditUser(id){
  const users=getUsers();
  const u=users.find(x=>x.id===id);if(!u)return;
  const name=prompt('이름:',u.name)||u.name;
  const pass=prompt('비밀번호 (변경 시 입력, 유지 시 Enter):','')||u.password;
  const role=prompt('권한 (admin/manager/viewer):',u.role)||u.role;
  const team=prompt('팀:',u.team)||u.team;
  Object.assign(u,{name,password:pass,role,team});
  saveUsers(users);
  addLog('계정 수정',name);
  render();showToast('계정이 수정됐습니다 ✓');
}

function adminToggleUser(id){
  const users=getUsers();
  const u=users.find(x=>x.id===id);if(!u)return;
  u.active=!u.active;
  saveUsers(users);
  addLog(u.active?'계정 활성화':'계정 비활성화',u.name);
  render();
}

function adminClearData(key,name){
  if(!confirm(`${name} 데이터를 전부 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`))return;
  if(key==='reports')S.reports=[];
  else if(key==='issues')S.issues=[];
  else if(key==='mat')S.mat=[];
  else if(key==='md')S.md=[];
  else if(key==='vessels')S.vessels=[];
  sv();addLog('데이터 전체 삭제',name);render();showToast(`${name} 데이터 삭제 완료`);
}

function saveSystemConf(){
  const conf={
    siteName:document.getElementById('conf-name')?.value||'PANASIA CMS',
    allowViewer:document.getElementById('conf-viewer')?.checked||false,
    autoSave:document.getElementById('conf-autosave')?.checked||true,
  };

  addLog('시스템 설정 변경');

}

  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
    showInstallBanner();
  });

  window.addEventListener('appinstalled',()=>{
    hideInstallBanner();
    deferredPrompt=null;
    console.log('[PANASIA CMS] 앱 설치 완료');
  });

  function showInstallBanner(){
    if(document.getElementById('install-banner'))return;
    const banner=document.createElement('div');
    banner.id='install-banner';
    banner.innerHTML=`
      <div style="position:fixed;top:0;left:0;right:0;z-index:9999;
        background:#1d4ed8;color:#fff;padding:12px 16px;
        display:flex;align-items:center;gap:12px;
        box-shadow:0 2px 12px rgba(0,0,0,.3);font-family:inherit">
        <span style="font-size:24px">📱</span>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700">PANASIA CMS 앱 설치</div>
          <div style="font-size:11px;opacity:.85;margin-top:1px">홈 화면에 추가하여 앱처럼 사용하세요</div>
        </div>
        <button onclick="installApp()" style="background:#fff;color:#1d4ed8;border:none;border-radius:8px;

          font-size:20px;cursor:pointer;padding:0 4px;opacity:.8">×</button>
      </div>`;
    document.body.prepend(banner);
  }

  function hideInstallBanner(){
    const b=document.getElementById('install-banner');
    if(b)b.remove();
    localStorage.setItem('install_dismissed',Date.now());
  }

  window.installApp=async function(){
    if(!deferredPrompt){
      showIOSGuide();
      return;
    }

      </div>

    document.body.style.overflow='hidden';

        z-index:9998;background:var(--bg);border:1px solid var(--border);border-radius:14px;
        padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,.18);font-family:inherit">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="font-size:28px">📲</span>
          <div>
            <div style="font-size:13px;font-weight:800">홈 화면에 앱 추가</div>
            <div style="font-size:11px;color:var(--text2)">앱처럼 사용하려면 아래 버튼을 탭하세요</div>
          </div>
          <button onclick="hideInstallBanner()" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;margin-left:auto">×</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;background:var(--bg-info);
          border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-info)">
          <span>공유 버튼(□↑)을 탭한 후 "홈 화면에 추가"를 선택하세요</span>
        </div>
      </div>`;
    document.body.appendChild(banner);
    setTimeout(hideInstallBanner,8000);
  }
})();
</script>


<script>
// 화면 방향 변경 시 레이아웃 재렌더
window.addEventListener('orientationchange', function(){
  setTimeout(function(){ if(typeof render==='function') render(); }, 150);
});
window.addEventListener('resize', function(){
  clearTimeout(window._resizeTimer);
  window._resizeTimer = setTimeout(function(){ if(typeof render==='function') render(); }, 200);
});
</script>

</body>
